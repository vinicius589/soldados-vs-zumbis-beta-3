name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    name: publicar-release
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Conferir versão da tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          tag = os.environ["TAG"]
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          expected = f"v{version}"
          if tag != expected:
              raise SystemExit(f"tag {tag} diverge da versão {expected}")
          print(f"versão validada: {version}")
          PY
      - name: Criar pacote-fonte
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          git archive --format=zip --prefix="soldados-vs-zumbis-${TAG}/" "${TAG}" \
            -o "dist/soldados-vs-zumbis-${TAG}.zip"
          sha256sum dist/* > dist/SHA256SUMS.txt
      - name: Publicar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --title "Soldados vs Zumbis $TAG" \
            --generate-notes
